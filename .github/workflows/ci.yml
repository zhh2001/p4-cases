name: ci

# Compile all P4 sources and Go controllers, including P4 examples
# without a complete runtime entry point. Run unit tests and shell lint.
# Live Mininet / BMv2 tests use root and network namespaces. This workflow
# does not run them. Validate each supported mode locally with run.sh.
#
# What CI catches:
#   * P4 source compile errors.
#   * Go controller source compile errors, tests and tidy drift.
#   * run.sh / run_helpers.sh lint regressions.
#   * Python syntax, runtime lifecycle and packet validation tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CASES: "01_packet_reflector 02_repeater 03_l2_forwarding_switch 04_l2_broadcast_switch 05_l2_learning_switch 06_int 07_meter 08_counter 09_ecmp_hash 10_firewall_acl 11_vxlan_encap 12_register_flow_counter 13_clone_to_cpu 14_ipv6_lpm"

jobs:
  p4-compile:
    name: compile all P4 sources
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      # Install p4c as a binary package from p4lang OBS.
      # Print its version for comparison with local compiler output.
      - name: install p4c (p4lang OBS)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          curl -fsSL "https://download.opensuse.org/repositories/home:/p4lang/xUbuntu_22.04/Release.key" \
              | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/home_p4lang.gpg >/dev/null
          echo 'deb http://download.opensuse.org/repositories/home:/p4lang/xUbuntu_22.04/ /' \
              | sudo tee /etc/apt/sources.list.d/home-p4lang.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y p4lang-p4c
          p4c --version

      - name: compile every P4 source
        shell: bash
        run: |
          set -euo pipefail
          for case_dir in ${{ env.CASES }}; do
            for src in "$case_dir"/*.p4; do
              [[ -f "$src" ]] || { echo "::error::no P4 source in $case_dir"; exit 1; }
              base="$(basename "$src" .p4)"
              echo "::group::$case_dir ($base.p4)"
              mkdir -p "build/$case_dir"
              p4c -b bmv2 --target bmv2 --arch v1model --std p4-16 \
                  --p4runtime-files "build/$case_dir/$base.p4info.txt" \
                  -o "build/$case_dir" \
                  "$src"
              echo "::endgroup::"
            done
          done
          echo "All P4 sources compiled."

      - name: upload P4 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: p4-artifacts
          path: build/
          retention-days: 7

  go-build:
    name: go build controllers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: true
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build every controller
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          for case_dir in ${{ env.CASES }}; do
            if [[ -d "$case_dir/controller" ]]; then
              echo "::group::$case_dir"
              go build -o "bin/$case_dir" "./$case_dir/controller"
              echo "::endgroup::"
            fi
          done
          ls -la bin/

  python-runtime:
    name: Python runtime tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: install Mininet
        run: sudo apt-get update && sudo apt-get install -y mininet
      - name: check Python syntax
        run: /usr/bin/python3 -m compileall -q common tests ./*/*.py
      - name: run runtime tests
        run: /usr/bin/python3 -m unittest discover -s tests -v

  shellcheck:
    name: shellcheck run.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for f in common/run_helpers.sh */run.sh; do
            echo "::group::$f"
            shellcheck -x "$f" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
